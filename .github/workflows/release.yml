name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate payment rules and code
        run: |
          pnpm test
          pnpm lint

      - name: Validate database upgrades
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Abonelik Takvimi v__VERSION__"
          releaseBody: |
            Abonelik Takvimi 0.5.1 — Snapshot yükleme düzeltmesi

            - Ekim snapshot'ında görülen "snapshot_items has no column named amount_mode" hatası düzeltildi
            - İlk geliştirme sürümünden kalan bilinen v4 migration'ı veri ve kontrol toplamları değiştirilmeden desteklenir
            - Veritabanı yükseltmesi arayüz sorgularından önce tamamlanır; eşzamanlı bağlantı hazırlığı engellenir
            - Geçmiş aylar, ödeme durumları ve korunması gereken tutarlar yükseltmede saklanır
            - Windows, macOS ve Linux üzerinde 23 ödeme/bağlantı testi ve 4 gerçek SQLx migration testi

            Güncelleme: Açık uygulamayı kapatıp yeni kurulumu mevcut sürümün üzerine yükleyin. Veritabanını veya uygulama veri klasörünü silmeyin; ilk açılışta yükseltme otomatik uygulanır.

            Kurulum: Windows x64 .exe/.msi; macOS Intel ve Apple Silicon universal .dmg; Linux x64 .AppImage/.deb/.rpm.
            Dosya bütünlüğü için SHA256SUMS.txt dosyasını kullanabilirsiniz.
            Kurulum paketleri ticari kod imzalama/noter onayı içermez; işletim sistemi ilk açılışta yayıncı doğrulama uyarısı gösterebilir.
            E-posta hatırlatmaları uygulama açıkken çalışır. Uygulama şifresi işletim sisteminin kimlik kasasında saklanır.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: Upload Release Artifacts (Workflow)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/bundle/macos/*.app
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe

  publish:
    name: Verify installers and publish release
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify all platform installers
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              throw new Error('Release tag and application version do not match');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`Release not found: ${tag}`);
            const required = ['.msi', '-setup.exe', '_universal.dmg', '.AppImage', '.deb', '.rpm', '.app.tar.gz'];
            for (const suffix of required) {
              if (!release.assets.some(asset => asset.name.endsWith(suffix) && asset.size > 0 && asset.state === 'uploaded')) {
                throw new Error(`Missing or empty installer: ${suffix}`);
              }
            }
            core.setOutput('tag', tag);

      - name: Add SHA256 checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.msi' --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.app.tar.gz'
          (cd release-assets && sha256sum *) > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
